<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membres | Admin EJP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/index.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'selector',
            theme: {
                extend: {
                    colors: { gold: { 50: '#F7F3E9', 100: '#E8D9A0', 400: '#C9A84C', 500: '#D4AF37', 600: '#F5E27A' } },
                    fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="flex min-h-screen bg-[#0D0D0D] text-[#F5F0E8]">
    <!-- Sidebar -->
    <aside class="w-20 lg:w-64 flex-shrink-0 border-r border-gold-500/10 bg-[#1A1A1A] flex flex-col items-center lg:items-start transition-all">
        <div class="h-20 w-full flex items-center justify-center lg:justify-start lg:px-8 border-b border-gold-500/10">
            <a href="/admin/dashboard.html" class="text-2xl font-serif gold-gradient-text tracking-widest uppercase">EJP</a>
        </div>
        <nav class="flex-1 w-full py-8 space-y-2 px-4">
            <a href="/admin/dashboard.html" class="flex items-center space-x-4 p-4 rounded-2xl hover:bg-white/5 text-[#A89B7A] group transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span class="hidden lg:inline text-[10px] font-bold uppercase tracking-[0.2em]">Dashboard</span>
            </a>
            <a href="/admin/membres.html" class="flex items-center space-x-4 p-4 rounded-2xl bg-gold-500/10 border border-gold-500/20 text-gold-500 group transition-all">
                 <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
                <span class="hidden lg:inline text-[10px] font-bold uppercase tracking-[0.2em]">Membres</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto">
        <header class="h-20 border-b border-gold-500/10 flex items-center justify-between px-10 bg-[#0D0D0D]/80 backdrop-blur-md sticky top-0 z-30">
            <h2 class="font-serif text-2xl gold-gradient-text">Gestion des Membres</h2>
            <button class="bg-gold-500 text-black px-8 py-3 rounded-2xl text-[10px] font-bold uppercase tracking-[0.2em] shadow-lg shadow-gold-500/20 hover:scale-[1.02] transition-all">
                Ajouter Membre
            </button>
        </header>

        <div class="p-10 space-y-10">
            <!-- Search & Filters -->
            <div class="flex flex-col md:flex-row space-y-6 md:space-y-0 md:space-x-6">
                <div class="flex-1 relative">
                    <input type="text" placeholder="Rechercher..." class="w-full bg-[#1A1A1A] border border-gold-500/10 rounded-2xl py-4 px-14 text-sm focus:outline-none focus:border-gold-500/40 transition-all text-white">
                    <svg class="absolute left-6 top-1/2 -translate-y-1/2 text-gold-500/40" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>
                <select class="bg-[#1A1A1A] border border-gold-500/10 rounded-2xl px-8 text-sm focus:outline-none focus:border-gold-500/40 text-white cursor-pointer uppercase font-bold tracking-widest text-[10px]">
                    <option>Tous les statuts</option>
                    <option>Nouveau Membre</option>
                    <option>Star</option>
                </select>
            </div>

            <!-- Table -->
            <div class="bg-[#1A1A1A] rounded-[2rem] border border-gold-500/10 overflow-hidden shadow-2xl">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-[9px] uppercase font-bold text-gold-500/40 tracking-[0.3em] bg-[#0D0D0D]">
                                <th class="px-10 py-6">Membre</th>
                                <th class="px-10 py-6">Statut</th>
                                <th class="px-10 py-6">Chef</th>
                                <th class="px-10 py-6">Arrivée</th>
                                <th class="px-10 py-6 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gold-500/5">
                            <tr class="hover:bg-white/5 transition-colors">
                                <td class="px-10 py-6">
                                    <div class="flex items-center space-x-4">
                                        <div class="h-12 w-12 rounded-2xl border border-gold-500/20 overflow-hidden shadow-lg">
                                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Jean" alt="User">
                                        </div>
                                        <div>
                                            <p class="text-sm font-bold text-[#F5F0E8]">Jean-Baptiste P.</p>
                                            <p class="text-[10px] text-[#A89B7A] tracking-wider uppercase">Nouveau Proche</p>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-10 py-6"><span class="px-3 py-1 bg-[#222222] text-[#A89B7A] text-[9px] rounded-full border border-white/5 uppercase font-bold tracking-widest">Nouveau</span></td>
                                <td class="px-10 py-6 text-xs text-[#A89B7A]">Past. Emmanuel</td>
                                <td class="px-10 py-6 text-xs text-[#A89B7A]">15/01/26</td>
                                <td class="px-10 py-6 text-right space-x-3">
                                    <button class="p-3 rounded-2xl bg-[#0D0D0D] border border-gold-500/10 hover:border-gold-500 transition-all text-gold-500">👁</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/theme.js"></script>
    <script type="module" src="assets/i18n/i18n.js"></script>
</body>
</html>
