<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EJP - Église des Jeunes Prodiges</title>
        <link rel="stylesheet" href="assets/css/index.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'selector',
            theme: {
                extend: {
                    colors: {
                        gold: {
                            50: '#F7F3E9',
                            100: '#E8D9A0',
                            400: '#C9A84C',
                            500: '#D4AF37',
                            600: '#F5E27A',
                        }
                    },
                    fontFamily: {
                        serif: ['Futura Std', 'Century Gothic', 'sans-serif'],
                        sans: ['Futura Std', 'Century Gothic', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style id="futura-fonts">
        @font-face { font-family: 'Futura Std'; src: url('fonts/FuturaStdLight.otf') format('opentype'); font-weight: 300; font-style: normal; }
        @font-face { font-family: 'Futura Std'; src: url('fonts/FuturaStdBook.otf') format('opentype'); font-weight: 400; font-style: normal; }
        @font-face { font-family: 'Futura Std'; src: url('fonts/FuturaStdMedium.otf') format('opentype'); font-weight: 500; font-style: normal; }
        @font-face { font-family: 'Futura Std'; src: url('fonts/FuturaStdBold.otf') format('opentype'); font-weight: 700; font-style: normal; }
        @font-face { font-family: 'Futura Std'; src: url('fonts/FuturaStdHeavy.otf') format('opentype'); font-weight: 800; font-style: normal; }
        @font-face { font-family: 'Futura Std'; src: url('fonts/FuturaStdExtraBold.otf') format('opentype'); font-weight: 900; font-style: normal; }
            body { font-family: 'Futura Std', 'Century Gothic', sans-serif; letter-spacing: 0.01em; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center grain-texture relative overflow-hidden">
    
    <!-- Background Decor -->
    <div class="absolute inset-0 z-0 opacity-20 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-gold-400 blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-gold-100 blur-[120px]"></div>
    </div>

    <!-- Top Controls -->
    <div class="absolute top-6 right-6 flex items-center space-x-4 z-10">
        <select id="lang-switcher" class="bg-transparent border border-gold-100 rounded-px px-2 py-1 text-sm focus:outline-none focus:border-gold-500 transition-colors">
            <option value="fr">🇫🇷 FR</option>
            <option value="en">🇬🇧 EN</option>
        </select>
        <button onclick="toggleTheme()" class="p-2 border border-gold-100 rounded-full hover:bg-gold-50 transition-all" id="theme-btn">
            <span id="theme-icon"><i class="ph ph-moon text-lg"></i></span>
        </button>
    </div>

    <!-- Login Card -->
    <div class="w-full max-w-md px-6 z-10 animate-in fade-in slide-in-from-bottom-8 duration-700">
        <div class="bg-[var(--surface)] dark:glass p-10 rounded-3xl gold-border shadow-2xl shadow-gold-500/10 space-y-8 relative overflow-hidden">
            
            <!-- Header -->
            <div class="text-center relative z-10">
                <div class="inline-flex items-center justify-center w-16 h-16 mb-4 rounded-full bg-gold-500/10 border border-gold-500/30 gold-glow text-gold-500">
                    <i class="ph ph-church text-3xl"></i>
                </div>
                <h1 class="text-2xl font-serif text-[var(--text-primary)] tracking-tight mb-2">EJP — Espace Membres</h1>
                <p class="text-sm text-[var(--text-secondary)]" data-i18n="login.subtitle">Connectez-vous à votre espace personnel</p>
            </div>

            <!-- Form -->
            <div class="space-y-6 relative z-10">
                <!-- Username/Email -->
                <div class="space-y-2">
                    <label class="block text-[11px] uppercase font-bold tracking-[0.15em] text-gold-500" data-i18n="login.username">Identifiant ou E-mail</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gold-500/50">
                            <i class="ph ph-user text-lg"></i>
                        </div>
                        <input type="text" placeholder="Entrez votre identifiant" class="w-full bg-[var(--surface-elevated)] border border-[var(--border-gold)] rounded-xl py-3.5 pl-11 pr-4 text-[var(--text-primary)] focus:outline-none focus:border-[var(--accent-gold)] focus:ring-1 focus:ring-[var(--accent-gold)] transition-all placeholder-[var(--text-secondary)]">
                    </div>
                </div>

                <!-- Password -->
                <div class="space-y-2">
                    <label class="block text-[11px] uppercase font-bold tracking-[0.15em] text-gold-500" data-i18n="login.password">Mot de passe</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gold-500/50">
                            <i class="ph ph-lock-key text-lg"></i>
                        </div>
                        <input type="password" id="password-input" placeholder="••••••••" class="w-full bg-[var(--surface-elevated)] border border-[var(--border-gold)] rounded-xl py-3.5 pl-11 pr-12 text-[var(--text-primary)] focus:outline-none focus:border-[var(--accent-gold)] focus:ring-1 focus:ring-[var(--accent-gold)] transition-all placeholder-[var(--text-secondary)]">
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gold-500/50 hover:text-gold-500 transition-colors">
                            <i id="toggle-icon" class="ph ph-eye text-lg"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit -->
                <button onclick="window.location.href='/frontend/dashboard.html'" class="w-full btn-gold py-4 rounded-xl shimmer transform text-sm tracking-widest mt-2" data-i18n="btn.login">
                    Se connecter
                </button>
                
                <div class="text-center pt-2">
                    <a href="#" class="text-xs text-[var(--text-secondary)] hover:text-gold-500 transition-colors border-b border-transparent hover:border-gold-500" data-i18n="login.forgot">Mot de passe oublié ? Contactez votre Chef</a>
                </div>
            </div>
            
            <!-- Subtle gradient overlay on card bottom -->
            <div class="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-[var(--bg-primary)] to-transparent pointer-events-none opacity-20"></div>
        </div>
        
        <!-- Footer Note -->
        <div class="mt-8 text-center z-10">
            <p class="text-[10px] text-[var(--text-secondary)] tracking-widest uppercase opacity-70" data-i18n="login.footer_note">Accès réservé aux membres enregistrés de l'EJP</p>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password-input');
            const icon = document.getElementById('toggle-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('ph-eye');
                icon.classList.add('ph-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('ph-eye-slash');
                icon.classList.add('ph-eye');
            }
        }
    </script>

    <!-- Scripts -->
    <script src="assets/js/theme.js"></script>
    <script type="module" src="assets/i18n/i18n.js"></script>
</body>
</html>
